<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOCAB 단어장</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #eceef2;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef2ff;
      --danger: #e11d48;
      --danger-soft: #fff1f2;
      --shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 8px 24px rgba(17, 24, 39, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0c10;
        --surface: #15171c;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --line: #23262d;
        --accent: #818cf8;
        --accent-hover: #a5b4fc;
        --accent-soft: #1e1b4b;
        --danger: #fb7185;
        --danger-soft: #2a1218;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.3);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      padding: 56px 16px 40px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 600px; margin: 0 auto; }

    header { margin-bottom: 32px; }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 5px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    h1 span { color: var(--accent); }
    .sub { margin: 10px 0 0; color: var(--muted); font-size: 1rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }

    form { display: flex; flex-wrap: wrap; gap: 10px; }
    input {
      flex: 1 1 170px;
      min-width: 0;
      padding: 14px 16px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid transparent;
      border-radius: 12px;
      transition: border-color 0.15s, background 0.15s;
    }
    input::placeholder { color: var(--muted); }
    input:focus {
      outline: none;
      background: var(--surface);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    button { font-family: inherit; cursor: pointer; border: none; }
    .add {
      flex: 0 0 auto;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border-radius: 12px;
      transition: background 0.15s, transform 0.1s;
    }
    .add:hover { background: var(--accent-hover); }
    .add:active { transform: scale(0.97); }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 4px 4px 12px;
    }
    .head h2 { margin: 0; font-size: 1rem; font-weight: 700; }
    .count {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 4px;
      border-top: 1px solid var(--line);
      animation: in 0.2s ease-out;
    }
    @keyframes in {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }
    .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .word { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em; }
    .meaning { color: var(--muted); margin-top: 3px; font-size: 0.95rem; }
    .del {
      flex: 0 0 auto;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border-radius: 10px;
      transition: color 0.15s, background 0.15s;
    }
    .del:hover { color: var(--danger); background: var(--danger-soft); }
    li.empty {
      display: block;
      text-align: center;
      color: var(--muted);
      padding: 36px 0;
      animation: none;
    }

    .saved {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="badge">MY WORDS</div>
      <h1><span>VOCAB</span> 단어장</h1>
      <p class="sub">외우고 싶은 단어를 모아 보세요.</p>
    </header>

    <div class="card">
      <form id="form">
        <input id="word" placeholder="단어 (예: apple)" autocomplete="off" required>
        <input id="meaning" placeholder="뜻 (예: 사과)" autocomplete="off" required>
        <button class="add" type="submit">추가</button>
      </form>
    </div>

    <div class="card">
      <div class="head">
        <h2>단어 목록</h2>
        <span class="count" id="count"></span>
      </div>
      <ul id="list"></ul>
    </div>

    <p class="saved">단어는 이 브라우저에 자동으로 저장돼요.</p>
  </div>

  <script>
    const KEY = "voca-words";
    const form = document.getElementById("form");
    const wordInput = document.getElementById("word");
    const meaningInput = document.getElementById("meaning");
    const list = document.getElementById("list");
    const count = document.getElementById("count");

    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(KEY));
        return Array.isArray(data) ? data : [];
      } catch (e) {
        return [];
      }
    }

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(words));
      } catch (e) {}
    }

    let words = load();

    function render() {
      list.innerHTML = "";
      count.textContent = words.length + "개";
      if (words.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "아직 단어가 없어요. 위에서 추가해 보세요!";
        list.appendChild(li);
        return;
      }
      words.forEach((item) => {
        const li = document.createElement("li");
        const text = document.createElement("div");
        text.className = "text";
        const w = document.createElement("div");
        w.className = "word";
        w.textContent = item.word;
        const m = document.createElement("div");
        m.className = "meaning";
        m.textContent = item.meaning;
        text.append(w, m);

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "삭제";
        del.addEventListener("click", () => {
          words = words.filter((x) => x.id !== item.id);
          save();
          render();
        });

        li.append(text, del);
        list.appendChild(li);
      });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const word = wordInput.value.trim();
      const meaning = meaningInput.value.trim();
      if (!word || !meaning) return;
      words.unshift({ id: Date.now() + Math.random(), word, meaning });
      save();
      render();
      form.reset();
      wordInput.focus();
    });

    render();
  </script>
</body>
</html>
